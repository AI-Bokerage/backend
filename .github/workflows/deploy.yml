name: Deploy

# After CI passes on main: build and push this repo's images (tagged with the commit), deploy them to
# the staging server, then to production once someone approves the "production" environment.
# Re-run by hand: Actions → Deploy → Run workflow. Server setup: backend repo, deploy/README.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer one waits instead of cancelling a half-finished deploy.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  images:
    name: push ${{ matrix.name }}
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: crm-backend, dockerfile: Dockerfile }
          - { name: crm-modauth, dockerfile: modules/auth/Dockerfile }
          - { name: crm-tenant, dockerfile: modules/tenant/Dockerfile }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/ai-bokerage/${{ matrix.name }}:${{ github.event.workflow_run.head_sha || github.sha }}
          # Links the package to this repo, so this repo's deploy token may pull it.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  staging:
    needs: images
    uses: ./.github/workflows/deploy-to-server.yml
    permissions:
      contents: read
      packages: read
    with:
      environment: staging
      tag: ${{ github.event.workflow_run.head_sha || github.sha }}
    secrets: inherit

  production:
    needs: staging
    uses: ./.github/workflows/deploy-to-server.yml
    permissions:
      contents: read
      packages: read
    with:
      environment: production
      tag: ${{ github.event.workflow_run.head_sha || github.sha }}
    secrets: inherit
