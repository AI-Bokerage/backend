name: CI

# Every push to main and every pull request: the backend must lint, type-check, test, and its three
# images (backend, auth, tenant) must still build. Deploy.yml runs after this passes on main
# (staging, then production on approval — deploy/README.md).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Build in-repo library (its dist/ is not committed)
        run: ./scripts/build-libs.sh
      - run: pnpm install --frozen-lockfile
      # Always: with pnpm's cache restored, @prisma/client's postinstall (prisma generate) is skipped
      # and the client comes out empty.
      - run: pnpm exec prisma generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  images:
    name: image ${{ matrix.name }} builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: crm-backend, dockerfile: Dockerfile }
          - { name: crm-modauth, dockerfile: modules/auth/Dockerfile }
          - { name: crm-tenant, dockerfile: modules/tenant/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
