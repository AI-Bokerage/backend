plugins {
    id 'java-library'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'maven-publish'
}

group = 'com.company'
version = '0.0.1-SNAPSHOT'
description = 'ppm-core — framework-agnostic PPM business logic (domain + application + ports)'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withJavadocJar()
    withSourcesJar()
}

tasks.named('javadoc', Javadoc) {
    // Internal library, not published to a public doc site — relax doclint's strict
    // link-resolution checking rather than adding imports across ~15 files purely to
    // satisfy the linter for cross-package {@link SimpleName} references whose prose
    // is otherwise correct (e.g. PlanAddOn's Javadoc mentioning {@link Plan} without
    // importing it). Missing/invalid content is still worth catching — this only
    // disables link-target resolution, not documentation-completeness output.
    options.addStringOption('Xdoclint:all,-reference', '-quiet')
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            pom {
                name = 'ppm-core'
                description = project.description
                url = 'https://github.com/your-org/Gen_PPM' // placeholder — update before any real release, see RELEASE_PROCESS.md
                licenses {
                    license {
                        name = 'Proprietary'
                        comments = 'Internal to the CPMS platform ecosystem — see LICENSE at the repository root.'
                    }
                }
                developers {
                    developer {
                        name = 'CPMS Platform Team'
                    }
                }
                scm {
                    url = 'https://github.com/your-org/Gen_PPM' // placeholder — see RELEASE_PROCESS.md
                }
            }
        }
    }
    // Deliberately no `repositories { maven { ... } }` block yet — publishing target
    // (internal registry vs. Maven Central) is a Phase 8 decision, not this phase's.
    // `publishToMavenLocal` already works with the publication defined above; see
    // RELEASE_PROCESS.md for the local-verification procedure this enables.
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.boot:spring-boot-dependencies:4.0.6'
    }
}

dependencies {
    // Spring wiring only (@Service, @Transactional) — no MVC, security, JPA, or AMQP.
    //
    // Explicit literal versions here, not left to io.spring.dependency-management's BOM
    // import: that plugin resolves versions for THIS build's own compilation, but does not
    // propagate a resolved version into the published POM/Gradle Module Metadata for `api`
    // dependencies — confirmed by publishing ppm-core, then trying to compile against it from
    // a genuinely separate project resolving only via Maven coordinates (no project(':ppm-core')
    // in the graph): Gradle failed with "Could not find org.springframework:spring-tx:" and
    // "...jackson-annotations:" — no version at all reached the external consumer. `api`
    // dependencies cross the library boundary into every consumer's own classpath, so their
    // versions must be real and published, not implicit. Versions below are the ones
    // io.spring.dependency-management itself resolves from the spring-boot-dependencies:4.0.6
    // BOM for this Spring Boot version — kept in sync with the BOM import below, not a
    // separate decision.
    api 'org.springframework:spring-context:7.0.7'
    api 'org.springframework:spring-tx:7.0.7'
    api 'org.slf4j:slf4j-api:2.0.17'
    api 'com.fasterxml.jackson.core:jackson-annotations:2.21'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.26.3'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.14.2'
    // Architecture enforcement (see src/test/.../architecture/ArchitectureTest.java) — guards the
    // library/host boundary and package convention frozen by ADR-002 with a failing test, not just
    // documentation, so a future contributor can't accidentally reintroduce a host-framework
    // dependency or a host-layer package name into ppm-core.
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('generateMetadataFileForMavenPublication') {
    // io.spring.dependency-management resolves versions via BOM import at build time rather
    // than literal version strings in `dependencies {}` — fully resolved and reproducible, but
    // Gradle's module-metadata validator can't see that and flags it as an "unversioned"
    // dependency. Known interaction between the two plugins; suppressing the check rather than
    // migrating this repo's four modules off io.spring.dependency-management, which is out of
    // scope for release engineering.
    suppressedValidationErrors.add('dependencies-without-versions')
}
