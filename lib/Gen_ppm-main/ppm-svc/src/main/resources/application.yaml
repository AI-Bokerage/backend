server:
  port: ${SERVER_PORT:8106}
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: ppm-svc

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_SVC_JWKS_URI:http://localhost:8101/.well-known/jwks.json}

  data:
    redis:
      host: ${PPM_REDIS_HOST:localhost}
      port: ${PPM_REDIS_PORT:6379}

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${PPM_DB_URL:jdbc:postgresql://localhost:5432/ppmdb}
    username: ${PPM_DB_USERNAME:ppm_owner}
    password: ${PPM_DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver

    hikari:
      pool-name: ppm-hikari-pool
      maximum-pool-size: ${PPM_DB_MAX_POOL_SIZE:20}
      minimum-idle: ${PPM_DB_MIN_IDLE:5}
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      leak-detection-threshold: 60000

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    table: flyway_schema_history_ppm
    validate-on-migrate: true
    locations:
      - classpath:db/migration

  rabbitmq:
    addresses: ${RABBITMQ_URL:amqp://guest:guest@localhost:5672}

    publisher-confirm-type: correlated
    publisher-returns: true

    template:
      mandatory: true

    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          initial-interval: 1s
          max-attempts: 3
          multiplier: 2

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      show-details: always

  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}

  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

metrics:
  tags:
    application: ppm-svc

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.springframework.amqp: INFO
    org.hibernate.SQL: WARN
    com.company.ppmsvc: INFO
    org.springframework.security: TRACE

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

messaging:
  exchanges:
    cpms: cpms.events

cpms:
  security:
    jwks-uri: ${AUTH_SVC_JWKS_URI:http://localhost:8101/.well-known/jwks.json}
    issuer:   ${AUTH_SVC_ISSUER:https://auth.cpms.io}

ppm:
  scheduling:
    enabled: ${PPM_SCHEDULING_ENABLED:true}

springdoc:
  api-docs:
    enabled: true
    path: /v1/docs/openapi.json

  swagger-ui:
    enabled: true
    path: /v1/docs
    documentTitle: PPM-SVC — Plan and Pricing Management
