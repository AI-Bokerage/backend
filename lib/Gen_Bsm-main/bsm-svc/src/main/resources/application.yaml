server:
  port: ${SERVER_PORT:8107}
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: bsm-svc

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${BSM_DB_URL}
    username: ${BSM_DB_USERNAME}
    password: ${BSM_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      pool-name: bsm-hikari-pool
      maximum-pool-size: ${BSM_DB_MAX_POOL_SIZE:20}
      minimum-idle: ${BSM_DB_MIN_IDLE:5}
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      leak-detection-threshold: 60000

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    table: flyway_schema_history_bsm
    validate-on-migrate: true
    locations:
      - classpath:db/migration

  data:
    redis:
      host: ${BSM_REDIS_HOST:localhost}
      port: ${BSM_REDIS_PORT:6379}
      ssl:
        enabled: ${BSM_REDIS_SSL:false}
      timeout: 5s

      lettuce:
        pool:
          enabled: true
          max-active: 20
          max-idle: 10
          min-idle: 5

  rabbitmq:
    addresses: "${RABBITMQ_URL:amqp://guest:guest@localhost:5672}"

    publisher-confirm-type: correlated
    publisher-returns: true

    template:
      mandatory: true

    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          initial-interval: 1s
          max-attempts: 3
          multiplier: 2

  mail:
    host: smtp.gmail.com
    port: 587
    username: "${MAIL_USERNAME}"
    password: "${MAIL_PASSWORD}"
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    default-encoding: UTF-8

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      show-details: always

  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}

  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

metrics:
  tags:
    application: bsm-svc

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.springframework.amqp: INFO
    org.hibernate.SQL: WARN

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

messaging:
  exchanges:
    bsm: bsm.exchange

  queues:
    subscription-created: bsm.subscription.created.queue
    subscription-cancelled: bsm.subscription.cancelled.queue
    plan-version-created: bsm.plan.version.created.queue

  routing-keys:
    subscription-created: bsm.subscription.created
    subscription-cancelled: bsm.subscription.cancelled
    plan-version-created: bsm.plan.version.created

resilience4j:
  circuitbreaker:
    instances:
      admService:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
      ppmPricing:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      ppmPromo:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      ppmVersion:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      ppmAddOnPricing:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

  retry:
    instances:
      admService:
        max-attempts: 3
        wait-duration: 2s
      # Retry transient Stripe gateway failures with exponential backoff.
      # Handles: network timeouts, rate limits (429), temporary 5xx from Stripe.
      # Max 3 attempts with 1s → 2s → 4s backoff — total max wait ~7s per call.
      stripeGateway:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.company.bsmsvc.domain.exception.PaymentGatewayException

services:
  adm-svc:
    base-url: ${ADM_SVC_BASE_URL:http://localhost:8102}
    internal-secret: ${INTERNAL_SERVICE_SECRET:chfghsdgyafsdhgffgasdfafsdhgfasdfasfdasfdxasfxgsgaxgsdfasfdasfdasfdasfdasfdasfdasfdasfdasfdasfdasf}

  audit-svc:
    base-url: ${AUDIT_SVC_BASE_URL:http://localhost:8084}

  notification-svc:
    base-url: ${NOTIFICATION_SVC_BASE_URL:http://localhost:8083}

  ppm-svc:
    base-url: ${PPM_SVC_BASE_URL:http://localhost:8106}
    connect-timeout-ms: ${PPM_SVC_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${PPM_SVC_READ_TIMEOUT_MS:10000}

  auth-svc:
    base-url: ${AUTH_SVC_INTERNAL_URL:http://localhost:8101}
    internal-secret: ${INTERNAL_SERVICE_SECRET:chfghsdgyafsdhgffgasdfafsdhgfasdfasfdasfdxasfxgsgaxgsdfasfdasfdasfdasfdasfdasfdasfdasfdasfdasfdasf}
    connect-timeout-ms: ${AUTH_SVC_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${AUTH_SVC_READ_TIMEOUT_MS:10000}

  usg-svc:
    base-url: ${USG_SVC_INTERNAL_URL:http://localhost:3110}
    connect-timeout-ms: ${USG_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${USG_READ_TIMEOUT_MS:10000}

cpms:
  security:
    jwks-uri: ${AUTH_SVC_JWKS_URI:http://localhost:8101/.well-known/jwks.json}
    issuer: ${AUTH_SVC_ISSUER:https://auth.cpms.io}
    internal-token: ${INTERNAL_TOKEN:change-me-in-production}

bsm:
  internal-secret: ${INTERNAL_SERVICE_SECRET:change-me-in-production}

  trial:
    default-days: ${BSM_TRIAL_DEFAULT_DAYS:14}

  schedule:
    executor-interval-ms: ${BSM_SCHEDULE_EXECUTOR_INTERVAL_MS:10000}

  provider-sync:
    retry-interval-ms: ${BSM_PROVIDER_SYNC_RETRY_INTERVAL_MS:60000}

  outbox:
    poll-interval-ms: ${BSM_OUTBOX_POLL_INTERVAL_MS:5000}
    batch-size: ${BSM_OUTBOX_BATCH_SIZE:50}

  messaging:
    tenant-created-queue: ${BSM_TENANT_CREATED_QUEUE:q.bsm.tenant-created}

springdoc:
  api-docs:
    enabled: true
    path: /v1/docs/openapi.json

  swagger-ui:
    enabled: true
    path: /v1/docs
    documentTitle: BSM-SVC — Billing & Subscription Management

payment:
  webhook:
    stripe-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
    razorpay-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID}
    key-secret: ${RAZORPAY_KEY_SECRET}
  reconciliation:
    threshold-seconds: ${PAYMENT_RECONCILIATION_THRESHOLD_SECONDS:300}
    interval-ms: ${PAYMENT_RECONCILIATION_INTERVAL_MS:300000}

refund:
  recovery:
    interval-ms: ${REFUND_RECOVERY_INTERVAL_MS:3000}

invoice:
  renewal:
    interval-ms: ${INVOICE_RENEWAL_INTERVAL_MS:60000}
# dunning:
#   policy:
#     day1-retry-after-hours: 0        # fires immediately
#     day3-retry-after-hours: 0
#     day7-retry-after-hours: 0
#     suspend-after-days: 0
#     cancel-after-days: 0
#   scheduler:
#     retry-interval-ms: 5000          # scheduler checks every 5 seconds

dunning:
  policy:
    day1-retry-after-hours: ${DUNNING_DAY1_HOURS:24}
    day3-retry-after-hours: ${DUNNING_DAY3_HOURS:72}
    day7-retry-after-hours: ${DUNNING_DAY7_HOURS:168}
    suspend-after-days: ${DUNNING_SUSPEND_DAYS:14}
    cancel-after-days: ${DUNNING_CANCEL_DAYS:30}
  scheduler:
    retry-interval-ms: ${DUNNING_RETRY_INTERVAL_MS:300000}
aws:
  s3:
    bucket-name: ${AWS_S3_BUCKET:cpms-bucket-1}
    region: ${AWS_REGION:ap-south-1}
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}
    presigned-url-expiry-minutes: ${AWS_PRESIGNED_EXPIRY_MINUTES:15}