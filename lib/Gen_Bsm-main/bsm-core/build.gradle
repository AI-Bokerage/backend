plugins {
    id 'java-library'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'maven-publish'
}

group = 'com.company'
version = '0.0.1-SNAPSHOT'
description = 'bsm-core — framework-agnostic BSM business logic (domain + application + ports)'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    // withJavadocJar() intentionally omitted this phase — bsm-core has no public API yet (R4:
    // empty of production code), and the javadoc tool fails on a module with zero documentable
    // classes ("No public or protected classes found to document"). Re-add once real classes land.
    withSourcesJar()
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            pom {
                name = 'bsm-core'
                description = project.description
            }
        }
    }
    // No repositories {} block yet — publishing target is a later-phase decision, same as ppm-core.
    // publishToMavenLocal already works with the publication defined above.
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.boot:spring-boot-dependencies:4.0.6'
    }
}

dependencies {
    // Spring wiring only (@Service, @Transactional) — no MVC, security, JPA, AMQP, Resilience4j,
    // or payment-provider SDKs.
    //
    // Explicit literal versions — io.spring.dependency-management resolves versions for THIS
    // build's own compilation but does not propagate a resolved version into the published
    // POM/Gradle Module Metadata for `api` dependencies (same issue ppm-core's build.gradle
    // documents and works around the same way). Versions below are what
    // io.spring.dependency-management itself resolves from the spring-boot-dependencies:4.0.6 BOM.
    api 'org.springframework:spring-context:7.0.7'
    api 'org.springframework:spring-tx:7.0.7'
    api 'org.slf4j:slf4j-api:2.0.17'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.26.3'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.14.2'
    // Architecture enforcement (see src/test/.../architecture/ArchitectureTest.java) — guards the
    // library/host boundary with a failing test, not just documentation.
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('generateMetadataFileForMavenPublication') {
    // Same io.spring.dependency-management / Gradle Module Metadata interaction ppm-core
    // documents — versions are fully resolved at build time via BOM import, but the validator
    // can't see that and flags `api` dependencies as "unversioned".
    suppressedValidationErrors.add('dependencies-without-versions')
}
