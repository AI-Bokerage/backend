services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: gennotif
      POSTGRES_USER: gennotif
      POSTGRES_PASSWORD: gennotif
    ports: ["5438:5432"]
    volumes: ["gennotif-pg:/var/lib/postgresql/data"]
  redis:
    image: redis:7
    ports: ["6381:6379"]
volumes:
  gennotif-pg: {}
