plugins {
    id 'java-library'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'maven-publish'
}

description = 'gen-adm-starter'

// ponytail: brief has no repositories{} anywhere (root or module) so this
// build cannot resolve any dependency as literally specified; mavenCentral()
// restored here as the minimal per-module fix, no Shibboleth (finding 2),
// no root file (finding 1). See task-1-report.md Fix section.
repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

// ponytail: no -parameters flag anywhere in this build, so @PathVariable/
// @RequestParam without an explicit name (RoleController#get, AssignmentController)
// fail at runtime with "parameter name information not available via
// reflection". Root-cause fix at the module level instead of naming every
// parameter by hand.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-parameters'
}

ext {
    testcontainersVersion = '1.21.3'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:4.0.6"
        mavenBom "org.testcontainers:testcontainers-bom:${testcontainersVersion}"
    }
}

dependencies {
    // Web
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Security — GenAdmPrincipal integrates with Spring Security's
    // SecurityContext (Task 3); no JWT/JWKS code lives here, that stays
    // in Gen_AUTH.
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // AOP — backs the tenant-context aspect (Task 3)
    implementation 'org.springframework:spring-aop'
    implementation 'org.aspectj:aspectjweaver'

    // Persistence
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'

    // Flyway — plain library, NOT spring-boot-starter-flyway. gen-adm-starter
    // runs its own independent Flyway instance (see FlywayConfig below) so it
    // never collides with a host app's own Flyway migrations at the default
    // classpath:db/migration location.
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    // Observability
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Swagger / OpenAPI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Configuration Processor
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = 'com.example'
            artifactId = 'gen-adm-starter'
            version = project.version
            from components.java
        }
    }
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/GEN-MS/Gen_ADM")
            credentials {
                username = System.getenv("GITHUB_ACTOR")
                password = System.getenv("GITHUB_TOKEN")
            }
        }
    }
}
