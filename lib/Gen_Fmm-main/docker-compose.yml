services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: genfmm
      POSTGRES_USER: genfmm
      POSTGRES_PASSWORD: genfmm
    ports: ["5441:5432"]
    volumes: ["genfmm-pg:/var/lib/postgresql/data"]
  redis:
    image: redis:7
    ports: ["6385:6379"]
volumes:
  genfmm-pg: {}
