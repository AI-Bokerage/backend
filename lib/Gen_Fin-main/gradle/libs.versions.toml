[versions]
junit-jupiter = "5.11.4"
assertj = "3.27.3"
mockito = "5.15.2"
archunit = "1.3.0"
testcontainers = "1.20.4"
jacoco = "0.8.12"
spotless = "7.0.2"
checkstyle = "10.21.1"
pmd = "7.9.0"
errorprone-plugin = "4.1.0"
errorprone-core = "2.36.0"
dependency-analysis = "2.7.0"
spring-boot = "3.4.2"
spring-dependency-management = "1.1.7"
stripe-java = "33.2.0"
razorpay-java = "1.4.10"
pdfbox = "3.0.7"

[libraries]
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone-core" }
stripe-java = { module = "com.stripe:stripe-java", version.ref = "stripe-java" }
razorpay-java = { module = "com.razorpay:razorpay-java", version.ref = "razorpay-java" }
pdfbox = { module = "org.apache.pdfbox:pdfbox", version.ref = "pdfbox" }

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }
dependency-analysis = { id = "com.autonomousapps.dependency-analysis", version.ref = "dependency-analysis" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
