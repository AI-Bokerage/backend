services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: genusg
      POSTGRES_USER: genusg
      POSTGRES_PASSWORD: genusg
    ports: ["5439:5432"]
    volumes: ["genusg-pg:/var/lib/postgresql/data"]
  redis:
    image: redis:7
    ports: ["6383:6379"]
volumes:
  genusg-pg: {}
