  /crm/reports:
    get:
      tags: [Reports]
      summary: 'Pick one: renewals · AI usage · pipeline · team performance'
      description: >
        Tenant Admin scopes to every person in the brokerage by default
        (narrow with teamId or brokerId); Team Lead is always scoped to
        their own team (narrow with brokerId). ai-usage returns one row per
        person in scope (AI calls, credits, blocked calls) from the AI gateway
        for the date range (default: the last 30 days); credits, not dollars,
        because only the Super Admin sees the real AI cost.
      security: [{ crmBearer: [] }]
      parameters:
        - name: type
          in: query
          required: true
          schema: { type: string, enum: [pipeline, renewals, team-performance, ai-usage] }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: brokerId, in: query, schema: { type: string, format: uuid } }
        - name: teamId
          in: query
          description: Tenant Admin only.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Report data — an empty/zeroed result when nothing matches ("Nothing to show, try a wider range").
        '403':
          description: brokerId is outside the caller's scope, or a Team Lead has no team

  /crm/reports/export:
    get:
      tags: [Reports]
      summary: 'Export as a spreadsheet — the export itself is recorded'
      description: Same parameters as GET /crm/reports. Returns a CSV download.
      security: [{ crmBearer: [] }]
      parameters:
        - name: type
          in: query
          required: true
          schema: { type: string, enum: [pipeline, renewals, team-performance, ai-usage] }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: brokerId, in: query, schema: { type: string, format: uuid } }
        - { name: teamId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: CSV file
          content:
            text/csv:
              schema: { type: string }

  /crm/tenant/profile:
    get:
      tags: [Tenant Admin]
      summary: Brokerage profile
      security: [{ crmBearer: [] }]
      responses:
        '200':
          description: The brokerage's profile (empty defaults if never set)
    patch:
      tags: [Tenant Admin]
      summary: Update the brokerage profile
      security: [{ crmBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string }
                supportEmail: { type: string, format: email }
                phone: { type: string }
                address: { type: string }
      responses:
        '200':
          description: Updated

  /crm/tenant/booking-settings:
    get:
      tags: [Tenant Admin]
      summary: Booking page setup
      description: Settings/config only — no public scheduling/availability engine behind this.
      security: [{ crmBearer: [] }]
      responses:
        '200':
          description: Current settings (disabled defaults if never set up)
    patch:
      tags: [Tenant Admin]
      summary: Update the booking page setup
      security: [{ crmBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                slug:
                  {
                    type: string,
                    example: acme-realty,
                    description: 'Lowercase letters, numbers and hyphens only.',
                  }
                enabled: { type: boolean }
                bufferMinutes: { type: integer, minimum: 0, maximum: 240 }
                defaultBrokerUserId:
                  {
                    type: string,
                    format: uuid,
                    nullable: true,
                    description: 'Receives brand-new leads from the public booking page (Flow 4.8).',
                  }
      responses:
        '200':
          description: Updated
        '400':
          description: A slug is required on first setup
        '409':
          description: That slug is already taken by another brokerage

  /crm/tenant/book:
    get:
      tags: [Tenant Admin]
      summary: Every lead and client across the brokerage
      description: No team filter — every person in the tenant, not just one team.
      security: [{ crmBearer: [] }]
      responses:
        '200':
          description: Every lead in the tenant
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Lead' }

  /crm/tenant/export:
    post:
      tags: [Tenant Admin]
      summary: 'Export all our data — self-service, distinct from the Super Admin cancellation export'
      description: Packages the tenant's own leads/clients, their mortgages, and tasks.
      security: [{ crmBearer: [] }]
      responses:
        '201':
          description: Export job started
    get:
      tags: [Tenant Admin]
      summary: Latest export status
      security: [{ crmBearer: [] }]
      responses:
        '200':
          description: The latest export job, or null if none has been started

  /crm/tenant/export/{jobId}/download:
    get:
      tags: [Tenant Admin]
      summary: Download the export
      description: 403 if jobId isn't this tenant's current (latest) export.
      security: [{ crmBearer: [] }]
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The zip file
        '403':
          description: Not your brokerage's export
        '409':
          description: Export is not ready yet
        '410':
          description: Download window has expired

  /crm/integrations/google/connect:
    get:
      tags: [Google integration]
      summary: 'Connect email/calendar — the Google OAuth consent URL'
      description: Broker and Team Lead each connect their own Google account.
      security: [{ crmBearer: [] }]
      responses:
        '200':
          description: The URL to redirect the browser to
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: object, properties: { url: { type: string } } }

  /crm/integrations/google/callback:
    get:
      tags: [Google integration]
      summary: OAuth callback
      description: >
        Public — Google redirects the browser here directly with no JWT.
        `state` is the userId that started the connect flow.
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Connected
        '400':
          description: Unknown user for this connection attempt

  /crm/integrations/google/status:
    get:
      tags: [Google integration]
      summary: Is Google connected, and as which account?
      security: [{ crmBearer: [] }]
      responses:
        '200':
          description: '{ connected, googleEmail }'

  /crm/integrations/google:
    delete:
      tags: [Google integration]
      summary: Disconnect
      security: [{ crmBearer: [] }]
      responses:
        '204':
          description: Disconnected

  /crm/appointments:
    post:
      tags: [Google integration]
      summary: 'New appointment (Flow 4.8) — pushed to Google Calendar if connected, else CRM-only'
      security: [{ crmBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, startTime, endTime]
              properties:
                title: { type: string }
                type:
                  type: string
                  enum: [CALL, CONSULTATION, DOCUMENT_REVIEW]
                  default: CONSULTATION
                  description: 'Flow 4.8 — call · consultation · document review'
                startTime: { type: string, format: date-time }
                endTime: { type: string, format: date-time }
                leadId: { type: string, format: uuid }
                attendeeEmails: { type: array, items: { type: string, format: email } }
      responses:
        '201':
          description: Created — check pushedToGoogle to see whether it reached Calendar
    get:
      tags: [Google integration]
      summary: My appointments
      security: [{ crmBearer: [] }]
      parameters:
        - {
            name: from,
            in: query,
            schema: { type: string, format: date-time },
            description: 'Starts at or after',
          }
        - {
            name: to,
            in: query,
            schema: { type: string, format: date-time },
            description: 'Starts before',
          }
      responses:
        '200':
          description: The caller's appointments

  /crm/team/calendar:
    get:
      tags: [CRM — Team Lead]
      summary: Team calendar — every appointment across the team's brokers
      security: [{ crmBearer: [] }]
      responses:
        '200':
          description: Team appointments

  /crm/emails/send:
    post:
      tags: [Google integration]
      summary: 'Sending an email (Flow 4.7)'
      description: 400 ("Connect Gmail to send") if the broker hasn't connected Google yet.
      security: [{ crmBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, subject, body]
              properties:
                to: { type: string, format: email }
                subject: { type: string }
                body: { type: string }
                leadId: { type: string, format: uuid }
      responses:
        '204':
          description: Sent — logged on the person's timeline (activity log)
        '400':
          description: Connect Gmail to send

  /crm/contacts:
    post:
      tags: [CRM]
      summary: Add a contact (SOW Module 14) — one of 7 fixed categories
      security: [{ crmBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, name]
              properties:
                category:
                  type: string
                  enum:
                    [
                      REALTOR,
                      LAWYER,
                      APPRAISER,
                      INSURANCE,
                      ACCOUNTANT,
                      HOME_INSPECTOR,
                      FINANCIAL_ADVISOR,
                    ]
                name: { type: string }
                company: { type: string }
                phone: { type: string }
                email: { type: string, format: email }
                dateOfBirth: { type: string, format: date-time }
                address: { type: string }
                city: { type: string }
                lastContactedAt: { type: string, format: date-time }
                notes: { type: string }
      responses:
        '201':
          description: Contact added
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Contact' }
    get:
      tags: [CRM]
      summary: 'List my contacts — search by name/company/email/phone (SOW 14.3), optionally filtered by category (14.4)'
      security: [{ crmBearer: [] }]
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - name: category
          in: query
          schema:
            type: string
            enum:
              [REALTOR, LAWYER, APPRAISER, INSURANCE, ACCOUNTANT, HOME_INSPECTOR, FINANCIAL_ADVISOR]
      responses:
        '200':
          description: Contacts
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: array, items: { $ref: '#/components/schemas/Contact' } }

  /crm/contacts/category-counts:
    get:
      tags: [CRM]
      summary: Contact count per category (SOW 14.4) — all 7 shown, zero-filled when empty
      security: [{ crmBearer: [] }]
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    additionalProperties: { type: integer }

  /crm/contacts/{id}:
    patch:
      tags: [CRM]
      summary: Update a contact
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Updated
    delete:
      tags: [CRM]
      summary: 'Permanently delete a contact (SOW 14.7) — recorded on the activity log'
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204':
          description: Deleted

  /crm/team/contacts:
    get:
      tags: [CRM — Team Lead]
      summary: Every contact across the team's brokers
      security: [{ crmBearer: [] }]
      responses:
        '200':
          description: Contacts
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: array, items: { $ref: '#/components/schemas/Contact' } }

  /crm/voice-notes:
    post:
      tags: [CRM]
      summary: 'Voice note → transcript (Flow 4.1)'
      description: >
        Send the recording (MP3 or WAV, up to 25MB) as the raw request body. The
        AI voice service keeps it for 7 days and transcribes it as a job: poll
        GET /crm/voice-notes/{id} until completed (transcript) or failed (retry,
        or type the notes). A failure because AI is off or the limit is reached
        is a failed job with error.code AI_DISABLED / AI_LIMIT_REACHED.
      security: [{ crmBearer: [] }]
      requestBody:
        required: true
        content:
          audio/mpeg:
            schema: { type: string, format: binary }
          audio/wav:
            schema: { type: string, format: binary }
      responses:
        '202':
          description: '{ id, status: queued, transcript: null, ... }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/VoiceNote' }
        '415': { description: Not MP3 or WAV (detected from the content) }

  /crm/voice-notes/{id}:
    get:
      tags: [CRM]
      summary: 'Did it transcribe? (poll)'
      description: Only the person who recorded it can read it.
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The voice note
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/VoiceNote' }
        '404': { description: Not found, or not yours }

  /crm/voice-notes/{id}/transcribe:
    post:
      tags: [CRM]
      summary: 'Retry a failed transcription (the recording is kept 7 days)'
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '202': { description: The voice note, queued again }
        '409': { description: Not in a state that can be retried }

  /crm/ai/review-notes:
    post:
      tags: [CRM]
      summary: 'Analyse notes before saving (Flow 4.1 → 4.2)'
      description: >
        Saves the notes in the AI notes service as the sealed original and
        starts an AI reading (a run). Poll GET /crm/ai/runs/{id}; decide each
        suggestion with POST /crm/ai/runs/{id}/decisions; Save = POST
        /crm/leads with aiRunId. Discard = just don't save: nothing is created
        in the CRM.
      security: [{ crmBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [notes]
              properties:
                notes: { type: string, maxLength: 60000 }
                fields:
                  type: object
                  description: 'What the form already holds: masked before the AI sees it, and never silently overwritten.'
                  properties:
                    name: { type: string }
                    email: { type: string, format: email }
                    phone: { type: string }
                    income: { type: number }
                    downPayment: { type: number }
                    dateOfBirth: { type: string, format: date-time }
      responses:
        '202':
          description: The run, queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/AiRun' }

  /crm/ai/runs/{id}:
    get:
      tags: [CRM]
      summary: 'AI review — poll the run and read its suggestions'
      description: A run with no person yet is visible to its author only; otherwise to whoever may see the person.
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/AiRun' }
        '404': { description: Not found, or not visible to you }

  /crm/ai/runs/{id}/decisions:
    post:
      tags: [CRM]
      summary: 'Accept, edit or reject each suggestion (Flow 4.2)'
      description: >
        notes-svc decisions, all or nothing per request. A value that would
        replace what the person already has needs replaceExisting true (else
        422 REPLACE_NOT_CONFIRMED); a flagged value must be edited first (422
        VALUE_NEEDS_EDIT).
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decisions]
              properties:
                decisions:
                  type: array
                  minItems: 1
                  maxItems: 300
                  items:
                    type: object
                    required: [suggestionId, decision]
                    properties:
                      suggestionId: { type: string }
                      decision: { type: string, enum: [approved, edited, rejected, pending] }
                      value: { description: 'The edited value (fields)' }
                      edits: { type: object, description: 'The edited task or email (title, notes, dueDate, priority, subject, body)' }
                      replaceExisting: { type: boolean }
      responses:
        '200': { description: The run with the decisions applied }
        '409': { description: Already decided or review closed }
        '422': { description: REPLACE_NOT_CONFIRMED, VALUE_NEEDS_EDIT or INVALID_VALUE }

  /crm/ai/runs/{id}/retry:
    post:
      tags: [CRM]
      summary: 'Read the notes again after a failed run'
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '202': { description: The run, queued again }
        '409': { description: NOT_RETRYABLE or RUN_ALREADY_LIVE }

  /crm/ai/assistant:
    post:
      tags: [CRM]
      summary: 'Ask the AI Assistant a question about your clients (Flow 4.10)'
      description: |
        Ask in plain English. The assistant answers **only from records you are allowed to see**
        (your own clients; a Team Lead also sees the team's) and gives links to the records it used.
        It only reads: it cannot create, change, send or delete anything.

        **What it can answer:**
        - Renewals in a period: "Who has renewals in the next 90 days?", "Who renews in March 2027?"
        - Missing documents: "Which files are missing tax documents?"
        - Overdue tasks: "Which tasks are overdue?"
        - One person's file: "Summarize Maria Gonzalez's file" (or send `clientId` when asking from
          that person's page)

        **How to test:** type a question in `question`, click Execute. To ask a follow-up, send the
        earlier turns in `history`. Nothing about the conversation is stored.

        **Three kinds of answer** (all HTTP 200), told apart by `status`:
        - `answered` — `answer` plus `sources` (the records it used, each with a `link`).
        - `cannot_determine` — "AI cannot determine the answer." `reason` says why:
          `unsupported_question` (not one of the kinds above, or asks to change something),
          `no_matching_client` / `client_not_found` (no one you may see by that name),
          `period_unclear`, `answer_unverifiable`.
        - `clarification_needed` — the name matched several people; pick one from `candidates`
          and ask again with its `clientId`.
      security: [{ crmBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string, maxLength: 2000 }
                history:
                  type: array
                  maxItems: 20
                  description: 'The conversation so far, oldest first (optional)'
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role: { type: string, enum: [user, assistant] }
                      content: { type: string }
                clientId:
                  type: string
                  format: uuid
                  description: 'The person whose page you are on (optional)'
      responses:
        '200':
          description: 'The answer (see the three kinds above)'
          content:
            application/json:
              examples:
                answered:
                  summary: 'An answer with links'
                  value:
                    success: true
                    data:
                      status: answered
                      answer: '- Maria Gonzalez with TD Bank'
                      partial: false
                      aiLabel: 'AI-assisted processing'
                      sources:
                        - type: mortgage
                          id: '17c722f7-1de0-429b-9d0a-f14957b56bfe'
                          clientId: '5bbfe38e-a36e-4628-a6bf-91c00d8c4616'
                          label: 'Maria Gonzalez'
                          link: '/clients/5bbfe38e-a36e-4628-a6bf-91c00d8c4616/mortgages/17c722f7-1de0-429b-9d0a-f14957b56bfe'
                cannotDetermine:
                  summary: "Couldn't find anything matching that"
                  value:
                    success: true
                    data: { status: cannot_determine, reason: no_matching_client, answer: 'AI cannot determine the answer.', sources: [], aiLabel: 'AI-assisted processing' }
        '403':
          description: 'AI features are switched off for you'
        '429':
          description: "Brokerage's daily AI allowance is used up — says when it resets"

  /crm/ai/search:
    post:
      tags: [CRM]
      summary: 'Smart search — find people by what their file is about'
      description: |
        Type a few words ("vacation property by the water", "client who still owes us tax paperwork") and get back the people
        whose notes, mortgages, documents and tasks match — only people you may see, best match first.
        Click one to open their person panel (`leadId`). To find someone **by name**, use the normal
        search instead: names are hidden from the AI, so they don't help here.

        **How to test:** type words that appear in someone's notes, click Execute. Changes to a file
        become searchable within about 5 minutes.

        It matches **meaning**, not just words: "freelancer who works for himself" finds a file that
        says "self-employed". `score` is how close the match is (0 to 1); a whole client file scores
        lowish (0.2–0.45) even when it is the right one, so read it as a ranking.
      security: [{ crmBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string, minLength: 2, maxLength: 500 }
      responses:
        '200':
          description: 'The people found (empty list = nothing matched)'
          content:
            application/json:
              example:
                success: true
                data:
                  aiLabel: 'AI-assisted processing'
                  results:
                    - { leadId: 'abf9550c-7c9f-4227-b7e8-5ccfa1c25658', name: 'Sam Patel', stage: NEW, city: null, score: 0.53 }
        '403':
          description: 'AI features are switched off'
        '429':
          description: "Brokerage's daily AI allowance used up"

  /crm/ai/recommendations/refresh:
    post:
      tags: [CRM]
      summary: 'Dashboard AI suggestions — refresh them'
      description: |
        The AI looks over your clients (renewals in the next ~4 months, people who need a follow-up,
        files missing documents) and suggests what to do next. Takes a few seconds.

        **How to test:** click Execute, then call `GET /crm/ai/recommendations/latest-run` until
        `status` is `completed`, then `GET /crm/ai/recommendations` to see them. Asking again while
        one is running (or right after one finished) returns that same run — no extra charge.
      security: [{ crmBearer: [] }]
      responses:
        '202':
          description: 'Started (or the run already in progress)'
          content:
            application/json:
              example:
                success: true
                data: { id: 'acdae274-fc3a-406a-8944-ca355a91b516', status: queued, types: [renewal, follow_up, missing_documents], recommendationCount: 0, warnings: [], error: null, reused: false }
        '403':
          description: 'AI features are switched off'
        '429':
          description: "Brokerage's daily AI allowance used up"

  /crm/ai/recommendations/latest-run:
    get:
      tags: [CRM]
      summary: 'Dashboard AI suggestions — is the refresh done?'
      description: '`status`: `queued` / `processing` (wait), `completed` (read the list), `failed` (`error` says why). 404 `NO_RUNS_YET` until the first refresh.'
      security: [{ crmBearer: [] }]
      responses:
        '200':
          description: 'The latest refresh'
          content:
            application/json:
              example:
                success: true
                data: { id: 'acdae274-fc3a-406a-8944-ca355a91b516', status: completed, recommendationCount: 3, warnings: [], error: null }

  /crm/ai/recommendations:
    get:
      tags: [CRM]
      summary: 'Dashboard AI suggestions — the card'
      description: |
        Your current suggestions, most important first. Each says what kind it is (`renewal`,
        `follow_up`, `missing_documents`), who it is about (`clientId` — open their person panel),
        why (`reason`), and whether it comes with a ready-made task (`hasSuggestedTask`).
        Only ever your own; nothing is changed until you act on one.
      security: [{ crmBearer: [] }]
      responses:
        '200':
          description: 'The suggestions'
          content:
            application/json:
              example:
                success: true
                data:
                  recommendations:
                    - id: '4fc21d43-0c55-4a8e-9a43-1d0f7f3b2c11'
                      type: missing_documents
                      priority: low
                      status: new
                      clientId: '5bbfe38e-a36e-4628-a6bf-91c00d8c4616'
                      title: 'Request Government photo ID from Maria Gonzalez'
                      reason: 'The file is missing one required document.'
                      hasSuggestedTask: true
                      aiLabel: 'AI-assisted processing'

  /crm/ai/recommendations/{id}/dismiss:
    post:
      tags: [CRM]
      summary: 'Dashboard AI suggestions — dismiss one'
      description: 'It disappears from the card and is not suggested again for a while.'
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 'Dismissed'

  /crm/ai/recommendations/{id}/task:
    post:
      tags: [CRM]
      summary: 'Dashboard AI suggestions — add it as a real task'
      description: |
        Turns the suggestion's ready-made task into a real task on that person (it appears in Tasks,
        active straight away). Send an empty body `{}` to take it as suggested, or change the
        `title`, `dueDate` (YYYY-MM-DD, not in the past; `null` for none) or `priority` first.
        Asking twice gives the same task, never a duplicate.
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 120 }
                dueDate: { type: string, format: date, nullable: true }
                priority: { type: string, enum: [low, medium, high, urgent] }
      responses:
        '201':
          description: 'The task that was created'
        '404':
          description: 'No such suggestion, or a person you may not see'
        '409':
          description: 'Already added with different changes, or dismissed'

  /crm/leads/{id}/ai/suggest-tasks:
    post:
      tags: [CRM]
      summary: 'Ask the AI to suggest follow-up tasks from this person''s notes (Flow 4.9)'
      description: |
        The AI reads this person's notes and proposes follow-up tasks ("Call Sam Friday about
        pre-approval"). Each one is added to the task list as **Suggested** — it is not a real
        task until you approve it.

        **How to test:** pick a person who has notes (`GET /crm/leads`), paste their id, click
        Execute.
        - **202** `ready: false` — the AI is still reading (a few seconds). Click Execute again;
          the same notes are read only once, so this costs nothing extra.
        - **200** `ready: true` — `tasks` are the Suggested tasks waiting for you. Then:
          approve one with `PATCH /crm/tasks/{id}/approve` (it becomes a real task), or dismiss
          it with `DELETE /crm/tasks/{id}` (it disappears).
        - `status: failed` — the AI couldn't read the notes; retry with
          `POST /crm/ai/runs/{runId}/retry`, then call this again.

        Asking again never adds the same task twice.
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 'Done — the Suggested tasks waiting for approve or dismiss'
          content:
            application/json:
              example:
                success: true
                data:
                  ready: true
                  runId: 'e3f1b6a4-92c7-4d58-a1e0-7c4b9d2f5a68'
                  status: processed
                  error: null
                  tasks:
                    - id: '0b6c1d2e-4f5a-4b7c-8d9e-1f2a3b4c5d6e'
                      title: 'Call Sam about pre-approval documents'
                      dueDate: '2026-10-23T00:00:00.000Z'
                      priority: MEDIUM
                      suggested: true
        '202':
          description: 'Still reading the notes — call again in a few seconds'
          content:
            application/json:
              example:
                success: true
                data: { ready: false, runId: 'e3f1b6a4-92c7-4d58-a1e0-7c4b9d2f5a68', status: processing, error: null, tasks: [] }
        '400':
          description: 'This person has no notes yet'
        '403':
          description: 'AI features are switched off'
        '429':
          description: "Brokerage's daily AI allowance used up"

  /crm/leads/{id}/email-drafts:
    post:
      tags: [CRM]
      summary: 'Save an email draft — nothing is sent (Flow 4.7)'
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, body]
              properties:
                intent:
                  {
                    type: string,
                    enum: [FOLLOW_UP, RENEWAL, BIRTHDAY, DOCUMENTS, ANNUAL_REVIEW, REFINANCE],
                  }
                subject: { type: string }
                body: { type: string }
                aiAssisted: { type: boolean }
      responses:
        '201':
          description: 'Draft saved'
    get:
      tags: [CRM]
      summary: "This person's saved drafts"
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 'OK'

  /crm/email-drafts/{draftId}:
    patch:
      tags: [CRM]
      summary: 'Edit a saved draft'
      security: [{ crmBearer: [] }]
      parameters:
        - { name: draftId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                intent: { type: string }
                subject: { type: string }
                body: { type: string }
      responses:
        '200':
          description: 'OK'

  /crm/settings:
    get:
      tags: [CRM]
      summary: 'My CRM settings (Flow 4.12)'
      security: [{ crmBearer: [] }]
      responses:
        '200':
          description: '{ aiEnabled }'
    patch:
      tags: [CRM]
      summary: 'AI features on or off (Flow 4.12)'
      description: >
        Switched off, every AI endpoint returns 403 and the frontend hides its buttons.
      security: [{ crmBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [aiEnabled]
              properties:
                aiEnabled: { type: boolean }
      responses:
        '200':
          description: 'OK'

  /crm/tasks/{id}/approve:
    patch:
      tags: [CRM]
      summary: 'Approve a suggested task — it becomes a real task (Flow 4.9)'
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 'OK'
        '409':
          description: 'Not a suggested task'

  /crm/tasks/{id}:
    delete:
      tags: [CRM]
      summary: 'Dismiss a suggested task, or delete an unlinked one (Flow 4.9)'
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204':
          description: 'Deleted'
        '409':
          description: 'A real, linked task is completed, not deleted'

  /crm/tasks/{id}/link:
    patch:
      tags: [CRM]
      summary: 'Reassign an unlinked task to another person (Flow 4.9)'
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [leadId]
              properties:
                leadId: { type: string, format: uuid }
      responses:
        '200':
          description: 'OK'

  /crm/dashboard:
    get:
      tags: [CRM]
      summary: 'Broker dashboard (Flow 4)'
      description: >
        Hot leads, pipeline, portfolio value, renewals, today's meetings, follow-ups, birthdays, tasks due/overdue, missing documents; AI suggestions and refinance opportunities are stubs (empty). Every card is clickable — links holds the filtered list URL each card opens (relative to the API prefix), e.g. links.pipeline.UNDERWRITING = /crm/leads?stage=UNDERWRITING.
      security: [{ crmBearer: [] }]
      responses:
        '200':
          description: 'OK'

  /crm/search:
    get:
      tags: [CRM]
      summary: "Search the caller's book → person panel"
      security: [{ crmBearer: [] }]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: 'OK'

  /crm/notifications:
    get:
      tags: [CRM]
      summary: 'My notifications — reminders, digest, "broker notified" events'
      security: [{ crmBearer: [] }]
      responses:
        '200':
          description: 'OK'

  /crm/notifications/{id}/read:
    patch:
      tags: [CRM]
      summary: 'Mark a notification read'
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 'OK'

  /crm/leads/{id}/documents:
    get:
      tags: [CRM]
      summary: 'Documents tab — received, ticked, missing (Flow 4.5)'
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 'OK'
    post:
      tags: [CRM]
      summary: 'Upload a file yourself (Flow 4.5)'
      description: >
        Pick the file in Try it out; its type and name go in the boxes above.
        The file is virus-checked, stored, then read in the background by the AI
        document service (PDF, JPG, PNG, HEIC, XLSX, XLS, DOCX). The answer comes
        straight away with readStatus PENDING; you get a notification when it's
        ready to review (READ / PARTIAL) or couldn't be read (FAILED). Then use
        GET /crm/documents/{documentId}/review.
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - {
            name: type,
            in: query,
            required: true,
            schema:
              {
                type: string,
                enum:
                  [
                    ID,
                    T4,
                    NOA,
                    PAY_STUB,
                    EMPLOYMENT_LETTER,
                    BANK_STATEMENT,
                    PURCHASE_AGREEMENT,
                    MORTGAGE_STATEMENT,
                    PROPERTY_TAX,
                    OTHER,
                  ],
              },
          }
        - { name: fileName, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/pdf:
            schema: { type: string, format: binary }
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
      responses:
        '201':
          description: 'Stored'
        '413':
          description: 'Too large'
        '422':
          description: 'Failed the virus check — not stored'

  /crm/leads/{id}/documents/required:
    put:
      tags: [CRM]
      summary: 'Tick which documents this person needs to send'
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [types]
              properties:
                types:
                  {
                    type: array,
                    items:
                      {
                        type: string,
                        enum:
                          [
                            ID,
                            T4,
                            NOA,
                            PAY_STUB,
                            EMPLOYMENT_LETTER,
                            BANK_STATEMENT,
                            PURCHASE_AGREEMENT,
                            MORTGAGE_STATEMENT,
                            PROPERTY_TAX,
                            OTHER,
                          ],
                      },
                  }
      responses:
        '200':
          description: 'OK'

  /crm/leads/{id}/documents/request:
    post:
      tags: [CRM]
      summary: 'Request documents — email a 7-day link (Flow 4.5)'
      description: >
        From the broker's connected inbox; 409 if not connected unless useSystemAddress is true (system mail is a stub). Calling again generates a new link.
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                useSystemAddress: { type: boolean }
      responses:
        '201':
          description: '{ url, expiresAt, sentVia, missing }'
        '409':
          description: 'Connect your email, or send from the system address'

  /crm/documents/{documentId}/review:
    get:
      tags: [CRM]
      summary: 'See what was read from a document'
      description: >
        Every value the AI read, with how sure it is (confidenceLevel high /
        medium / low), why it might be wrong (flags), the text it came from, and
        whether you have decided it yet. For mortgage papers, mortgageMatch says
        which of the person's mortgages it seems to be about. Also refreshes the
        document's readStatus.
      security: [{ crmBearer: [] }]
      parameters:
        - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: '{ document: the CRM record, reading: status, fields[], mortgageMatch, warnings, aiLabel }' }
        '409': { description: The file was not sent for reading yet — retry reading it }

  /crm/documents/{documentId}/decisions:
    post:
      tags: [CRM]
      summary: 'Accept, edit or reject each value read'
      description: >
        Use the field ids from the review. "edited" needs the new value. A value
        that would replace what the person already has needs replaceExisting
        true. A value flagged as invalid must be edited before it can be accepted.
      security: [{ crmBearer: [] }]
      parameters:
        - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decisions]
              properties:
                decisions:
                  type: array
                  items:
                    type: object
                    required: [fieldId, decision]
                    properties:
                      fieldId: { type: string }
                      decision: { type: string, enum: [approved, edited, rejected, pending] }
                      value: { type: string, description: 'The corrected value, for "edited"' }
                      replaceExisting: { type: boolean }
      responses:
        '200': { description: The reading with your decisions }
        '422': { description: 'VALUE_NEEDS_EDIT or INVALID_VALUE' }

  /crm/documents/{documentId}/mortgage:
    put:
      tags: [CRM]
      summary: 'Say which mortgage this document is about'
      description: >
        Needed before applying when any mortgage value was accepted: one of this
        person's mortgages ({ "mortgageId" }) or a new one ({ "createNew": true }).
      security: [{ crmBearer: [] }]
      parameters:
        - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [mortgageId]
                  properties: { mortgageId: { type: string, format: uuid } }
                - type: object
                  required: [createNew]
                  properties: { createNew: { type: boolean, enum: [true] } }
      responses:
        '200': { description: The reading with the mortgage chosen }

  /crm/documents/{documentId}/retry:
    post:
      tags: [CRM]
      summary: "Try reading a document again (after it couldn't be read)"
      security: [{ crmBearer: [] }]
      parameters:
        - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '202': { description: Reading again }
        '409': { description: Can't be read again (already being reviewed, or the file is gone) }

  /crm/documents/{documentId}/apply:
    post:
      tags: [CRM]
      summary: 'Save the accepted values into the CRM'
      description: >
        Closes the review (anything still undecided counts as rejected), then
        fills only blank fields, unless you chose to replace one. Accepted job
        details go to the main applicant, complete debts become debt rows, and
        mortgage values update the mortgage you picked (or create it, when every
        required detail was accepted). Values the CRM has no place for come back
        in notApplied.
      security: [{ crmBearer: [] }]
      parameters:
        - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: '{ lead, applied: string[], skipped: string[] (already filled), notApplied: [{label, display}] }' }
        '409': { description: 'Still being read, or the mortgage choice is missing' }
        '422': { description: 'A new mortgage is missing a required detail' }

  /crm/documents/{documentId}/download:
    get:
      tags: [CRM]
      summary: 'Download a document (recorded in the activity log)'
      security: [{ crmBearer: [] }]
      parameters:
        - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 'OK'

  /crm/tenant/dashboard:
    get:
      tags: [CRM]
      summary: 'Brokerage dashboard (Flow 2)'
      description: >
        403 until the brokerage profile is complete (Flow 0).
      security: [{ crmBearer: [] }]
      responses:
        '200':
          description: 'OK'

  /crm/tenant/people/{userId}/reassign-clients:
    post:
      tags: [CRM]
      summary: "Reassign all of a person's clients before deactivating them (Flow 2)"
      description: >
        Both brokers are notified.
      security: [{ crmBearer: [] }]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toBrokerUserId]
              properties:
                toBrokerUserId: { type: string, format: uuid }
      responses:
        '200':
          description: '{ reassigned }'

  /crm/public/document-requests/{token}:
    get:
      tags: [CRM]
      summary: 'Borrower link — what is still needed (no login)'
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: '{ firstName, missing, expiresAt }'
        '410':
          description: 'Expired — ask your broker for a new link'

  /crm/public/document-requests/{token}/files:
    post:
      tags: [CRM]
      summary: 'Borrower upload through the link (no login)'
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - {
            name: type,
            in: query,
            required: true,
            schema:
              {
                type: string,
                enum:
                  [
                    ID,
                    T4,
                    NOA,
                    PAY_STUB,
                    EMPLOYMENT_LETTER,
                    BANK_STATEMENT,
                    PURCHASE_AGREEMENT,
                    MORTGAGE_STATEMENT,
                    PROPERTY_TAX,
                    OTHER,
                  ],
              },
          }
        - { name: fileName, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/pdf:
            schema: { type: string, format: binary }
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
      responses:
        '201':
          description: 'Received'
        '410':
          description: 'Expired'
        '422':
          description: 'Failed the virus check'

  /crm/public/bookings/{slug}:
    post:
      tags: [CRM]
      summary: 'Public booking page intake (Flow 4.8, no login)'
      description: >
        Same bookingRef twice → ignored. Email matches an existing person → appointment attached to them; otherwise a new lead for the page's default broker.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bookingRef, name, email, startTime, endTime]
              properties:
                bookingRef: { type: string }
                name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                title: { type: string }
                startTime: { type: string, format: date-time }
                endTime: { type: string, format: date-time }
      responses:
        '201':
          description: 'Booked'
        '200':
          description: 'Duplicate — ignored'
        '404':
          description: 'No such (enabled) booking page'

  /crm/internal/tenants/{tenantId}/profile-status:
    get:
      summary: 'Is the brokerage profile complete? (modules/auth Tenant Admin gate, Flow 0)'
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: '{ complete }'
          content:
            application/json:
              example: { success: true, data: { complete: false } }

  /crm/internal/brokers/{userId}/lead-count:
    get:
      tags: [Internal]
      summary: modules/auth calls this from the "Removing someone" deactivation check (SOW 2.11)
      description: >
        Internal — gated by X-Internal-Secret, not a JWT. "Do they still have
        clients assigned?" — every lead/client on this broker's book, Lost
        excluded.
      parameters:
        - name: X-Internal-Secret
          in: header
          required: true
          schema: { type: string }
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: tenantId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The count
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      count: { type: integer }

  /crm/webhooks/ai/{service}:
    post:
      summary: 'AI services report a finished job here (signed)'
      description: >
        Called by the AI services, not by people. Checked with the
        x-ai-signature header (HMAC over the exact body, 5-minute window).
      parameters:
        - { name: service, in: path, required: true, schema: { type: string, enum: [docread] } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '204': { description: Received }
        '401': { description: Signature missing, wrong or too old }
