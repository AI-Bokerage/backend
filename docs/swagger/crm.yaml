        '200':
          description: '[{ key, label }]'

  /crm/leads/{id}/ai/review:
    post:
      tags: [CRM]
      summary: 'AI tools tab — read this person''s notes again (Flow 4.3 → 4.2)'
      description: >
        Starts an AI reading (notes-svc) of the person's original and own notes.
        The same notes give back the same run rather than a new charge. Poll
        GET /crm/ai/runs/{runId}, decide, then POST /crm/leads/{id}/ai/apply.
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '202':
          description: The run, queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/AiRun' }
        '400': { description: This person has no notes to analyse yet }
        '403': { description: "You don't have access to this record" }

  /crm/leads/{id}/ai/draft-email:
    post:
      tags: [CRM]
      summary: 'Ask the AI to write a first draft of an email to this person'
      description: >
        Pick the purpose. The CRM gives the AI only the facts that purpose needs:
        a renewal gets the next mortgage to mature (lender, rate, balance,
        maturity date), a document request gets the documents still missing, a
        follow-up gets your purpose and their open tasks. You get the draft's id
        at once (status queued); check it with GET /crm/ai/email-drafts/{id} —
        usually ready in a few seconds. Nothing is sent: edit it, then save it
        (POST /crm/leads/{id}/email-drafts) or send it (POST /crm/emails/send).
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [intent]
              properties:
                intent: { type: string, enum: [FOLLOW_UP, RENEWAL, BIRTHDAY, DOCUMENTS, ANNUAL_REVIEW, REFINANCE] }
                purpose: { type: string, description: 'Why you are writing (needed for FOLLOW_UP)' }
                tone: { type: string, enum: [professional, warm, concise] }
      responses:
        '202': { description: 'The draft, queued — check it with GET /crm/ai/email-drafts/{id}' }
        '400': { description: "This person has no email address yet" }

  /crm/ai/email-drafts/{id}:
    get:
      tags: [CRM]
      summary: 'Check an AI email draft (and read it when ready)'
      description: >
        status: queued / processing (wait a moment) → ready (show subject and
        body) or ready_flagged (show it, but give it a closer look: flags say
        why). blocked_missing_context = a fact is missing (error.missing names
        it, e.g. no mortgage on file for a renewal). blocked = AI is off or the
        daily allowance is used up. failed = the draft didn't pass the checks;
        retry if error.retryable. versions lists every version; ask for an older
        one with ?version=1.
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: version, in: query, required: false, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: '{ id, status, version, subject, body, footer, flags, aiLabel, error, versions }' }

  /crm/ai/email-drafts/{id}/refine:
    post:
      tags: [CRM]
      summary: 'Ask the AI to change a draft ("make it shorter")'
      description: >
        Writes the next version from your instruction; the same facts still
        apply. Check it with GET /crm/ai/email-drafts/{id} like the first one.
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [instruction]
              properties:
                instruction: { type: string, maxLength: 500 }
                fromVersion: { type: integer, description: 'Start from this version (default: the latest)' }
      responses:
        '202': { description: 'Rewriting — check it again' }
        '409': { description: 'The draft is not ready yet' }

  /crm/ai/email-drafts/{id}/retry:
    post:
      tags: [CRM]
      summary: 'Try again after a draft failed'
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '202': { description: 'Writing again — check it again' }
        '409': { description: 'Not a failed draft that can be retried' }

  /crm/leads/{id}/ai/apply:
    post:
      tags: [CRM]
      summary: 'Apply an approved AI review to this person — blank fields only'
      description: >
        Finalizes the run (undecided values count as rejected), then fills only
        blank fields unless the broker chose to replace one, and creates the
        approved applicant, tasks and email draft (saved, never sent).
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [aiRunId]
              properties:
                aiRunId: { type: string, format: uuid }
      responses:
        '200':
          description: '{ lead, applied: string[], skipped: string[] (already filled), notApplied: [{label, display}] (no CRM field for it) }'
        '404': { description: The review is not this person's }

