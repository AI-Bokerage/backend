# The image's defaults, plus one change: don't load a second copy of the virus
# database while reloading it. That halves clamd's peak memory (~1.2 GB instead
# of ~2.4 GB); scans wait a few seconds during a reload instead.
LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav
ConcurrentDatabaseReload no
